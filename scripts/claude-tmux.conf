# tmux for `vc` Claudes (lua/claude/tmux.lua): keeps them running after their Neovim closes.
# Its own server (tmux -L claude-nvim), made invisible: no status bar, no prefix, no key bindings.
set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T root
set -g mouse off

# Keys and screen go straight through to Claude
set -g escape-time 0
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
# Neovim terminals are xterm-256color with true color
set -ga terminal-features ",xterm-256color:RGB"
